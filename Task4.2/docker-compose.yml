services:

  zeebe: # https://docs.camunda.io/docs/self-managed/platform-deployment/docker/#zeebe
    image: camunda/zeebe:${CAMUNDA_PLATFORM_VERSION}
    container_name: zeebe
    ports:
      - "26500:26500"
      - "9600:9600"
      - "8088:8080"
    environment: # https://docs.camunda.io/docs/self-managed/zeebe-deployment/configuration/environment-variables/
      - ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_CLASSNAME=io.camunda.zeebe.exporter.ElasticsearchExporter
      - ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_URL=http://elasticsearch:9200
      # default is 1000, see here: https://github.com/camunda/zeebe/blob/main/exporters/elasticsearch-exporter/src/main/java/io/camunda/zeebe/exporter/ElasticsearchExporterConfiguration.java#L259
      - ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_BULK_SIZE=1
      # allow running with low disk space
      - ZEEBE_BROKER_DATA_DISKUSAGECOMMANDWATERMARK=0.998
      - ZEEBE_BROKER_DATA_DISKUSAGEREPLICATIONWATERMARK=0.999
      - "JAVA_TOOL_OPTIONS=-Xms512m -Xmx512m"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "timeout 10s bash -c ':> /dev/tcp/127.0.0.1/9600' || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - zeebe:/usr/local/zeebe/data
    networks:
      - camunda-platform
    depends_on:
      - elasticsearch

  operate: # https://docs.camunda.io/docs/self-managed/platform-deployment/docker/#operate
    image: camunda/operate:${CAMUNDA_OPERATE_VERSION}
    container_name: operate
    ports:
      - "8081:8080"
    environment: # https://docs.camunda.io/docs/self-managed/operate-deployment/configuration/
      - CAMUNDA_OPERATE_ZEEBE_GATEWAYADDRESS=zeebe:26500
      - CAMUNDA_OPERATE_ELASTICSEARCH_URL=http://elasticsearch:9200
      - CAMUNDA_OPERATE_ZEEBEELASTICSEARCH_URL=http://elasticsearch:9200
      - CAMUNDA_OPERATE_CSRFPREVENTIONENABLED=false
      - management.endpoints.web.exposure.include=health
      - management.endpoint.health.probes.enabled=true
    healthcheck:
      test: [ "CMD-SHELL", "wget -O - -q 'http://localhost:8080/actuator/health/readiness'" ]
      interval: 30s
      timeout: 1s
      retries: 5
      start_period: 30s
    networks:
      - camunda-platform
    depends_on:
      - zeebe
      - elasticsearch

  tasklist: # https://docs.camunda.io/docs/self-managed/platform-deployment/docker/#tasklist
    image: camunda/tasklist:${CAMUNDA_TASKLIST_VERSION}
    container_name: tasklist
    ports:
      - "8082:8080"
    environment: # https://docs.camunda.io/docs/self-managed/tasklist-deployment/configuration/
      - CAMUNDA_TASKLIST_ZEEBE_GATEWAYADDRESS=zeebe:26500
      - CAMUNDA_TASKLIST_ZEEBE_RESTADDRESS=http://zeebe:8080
      - CAMUNDA_TASKLIST_ELASTICSEARCH_URL=http://elasticsearch:9200
      - CAMUNDA_TASKLIST_ZEEBEELASTICSEARCH_URL=http://elasticsearch:9200
      - CAMUNDA_TASKLIST_CSRFPREVENTIONENABLED=false
      - management.endpoints.web.exposure.include=health
      - management.endpoint.health.probes.enabled=true
    healthcheck:
      test: [ "CMD-SHELL", "wget -O - -q 'http://localhost:8080/actuator/health/readiness'" ]
      interval: 30s
      timeout: 1s
      retries: 5
      start_period: 30s
    networks:
      - camunda-platform
    depends_on:
      - zeebe
      - elasticsearch

  elasticsearch: # https://hub.docker.com/_/elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION}
    container_name: elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - bootstrap.memory_lock=true
      - discovery.type=single-node
      - xpack.security.enabled=false
      # allow running with low disk space
      - cluster.routing.allocation.disk.threshold_enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200/_cat/health | grep -q green" ]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - elastic:/usr/share/elasticsearch/data
    networks:
      - camunda-platform

  deploy-process:
    build:
      context: ./deploy-process
    volumes:
      - ./process.bpmn:/process.bpmn
    depends_on:
      zeebe:
        condition: service_healthy
    networks:
      - camunda-platform
    command: >
      "
      echo '⏳ Waiting for Zeebe...';
      until nc -z zeebe 26500; do sleep 5; done;
      echo '🚀 Deploying BPMN process...';
      zbctl deploy /process.bpmn --host zeebe --port 26500 --insecure;
      echo '✅ Process deployed!';
      sleep 30;
      "

  payment-service:
    build: .
    container_name: payment-service
    ports:
      - "3000:8080"
    environment:
      - ZEEBE_ADDRESS=zeebe:26500
      - PAYMENTS_DB=Host=postgres;Database=payments;Username=payments;Password=payments;GSS Encryption Mode=Disable
      - FRAUD_CHECK_URL=http://fraud-check-service:8080
      - NOTIFICATIONS_URL=http://notification-service:8080
      - Checks__Timeout=00:00:03
      # в демо пауза между повторами после сбоя растёт 1 → 2 → 4 с и дальше не увеличивается
      - Retries__MaxBackoff=00:00:04
      # в демо запрос может сократить сроки ручной проверки и исполнения перевода или возврата
      - Demo__TimingOverrides=true
    restart: on-failure
    networks:
      - camunda-platform
    depends_on:
      zeebe:
        condition: service_started
      postgres:
        condition: service_healthy
      fraud-check-service:
        condition: service_started
      notification-service:
        condition: service_started

  fraud-check-service:
    build:
      context: .
      dockerfile: src/FraudCheckService/Dockerfile
    container_name: fraud-check-service
    ports:
      - "3001:8080"
    environment:
      - REDIS=redis:6379
      - Aml__CacheTtl=1.00:00:00
      - Redis__Timeout=00:00:00.300
    restart: on-failure
    networks:
      - camunda-platform
    depends_on:
      redis:
        condition: service_started

  notification-service:
    build:
      context: .
      dockerfile: src/NotificationService/Dockerfile
    container_name: notification-service
    ports:
      - "3002:8080"
    restart: on-failure
    networks:
      - camunda-platform

  postgres:
    image: postgres:17-bookworm
    container_name: postgres
    environment:
      - POSTGRES_DB=payments
      - POSTGRES_USER=payments
      - POSTGRES_PASSWORD=payments
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U payments -d payments" ]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres:/var/lib/postgresql/data
    networks:
      - camunda-platform

  redis:
    image: redis:7.4-alpine
    container_name: redis
    networks:
      - camunda-platform

volumes:
  zeebe:
  elastic:
  postgres:

networks:
  camunda-platform: 
